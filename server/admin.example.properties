# 后台服务的配置。复制成 /etc/blog/admin.properties 再修改，然后：
#   sudo chown root:blog /etc/blog/admin.properties
#   sudo chmod 640 /etc/blog/admin.properties      （里面有数据库密码和两步验证的密钥，别人读不到）

# 只在本机监听，由 Nginx / Caddy 转发后台的地址过来；不要改成 0.0.0.0
listen.host=127.0.0.1
listen.port=8788

# 数据库：用后台自己的角色（能写文章、审核评论），密码和评论服务的不一样
db.host=127.0.0.1
db.port=5432
db.name=blog
db.user=blog_admin
db.password=换成建库后给 blog_admin 设置的密码

# 你的网站地址，只接受从这里发来的操作；有 www 和不带 www 两个地址的话用逗号隔开
site.origin=https://yourname.dev

# 你在评论区回复时显示的名字
owner.name=Your Name

# 管理密码的摘要：运行  java -jar /opt/blog/blog-server.jar hash-password  生成，整行粘贴到这里
admin.passwordHash=
# 两步验证：运行  java -jar /opt/blog/blog-server.jar totp-setup ，按提示加到手机的验证器 App，再把它输出的那一行粘贴到这里
admin.totpSecret=
# 只通过 HTTPS 发送登录凭证；只有在本机用 http://localhost 测试时才改成 false
admin.cookieSecure=true

# 后台的秘密地址：运行  java -jar /opt/blog/blog-server.jar random-path  生成，整行粘贴到这里，
# 再把同一串换进 Nginx（或 Caddy）配置里的 ADMIN_PATH。不要放进 Git 仓库，也别发给别人。
# 以后后台在 https://你的域名/这一串/ ；/admin/ 这类地址是假的登录页
admin.path=

# 网站文件所在的目录（repo.git、src、content、media、builds、live、backups 都在这里）
blog.base=/srv/blog

# 评论服务的地址：审核、回复、删除评论后通知它刷新缓存
comments.url=http://127.0.0.1:8787
