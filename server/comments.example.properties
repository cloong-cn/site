# 评论服务的配置（它也负责 /admin/、/wp-login.php 这些假后台页面）。复制成 /etc/blog/comments.properties 再修改，然后：
#   sudo chown root:blog-comments /etc/blog/comments.properties
#   sudo chmod 640 /etc/blog/comments.properties      （里面有数据库密码，别人读不到）

# 只在本机监听，由 Nginx / Caddy 转发 /api/comments 和假后台的地址过来；不要改成 0.0.0.0
listen.host=127.0.0.1
listen.port=8787

# 数据库（schema.sql 创建的那个角色和密码）
db.host=127.0.0.1
db.port=5432
db.name=blog
db.user=blog_web
db.password=换成建库后给 blog_web 设置的密码
db.pool=4

# 你的网站地址，只接受从这里提交的评论；有 www 和不带 www 两个地址的话用逗号隔开
site.origin=https://yourname.dev
# 网站文件所在的目录（用来确认评论的文章确实存在，假后台的页面也从这里读）
site.root=/srv/blog/live

# 访客 IP 只保存加盐后的摘要；运行  java -jar /opt/blog/blog-server.jar random-salt  生成一个，之后不要再改
security.ipSalt=

# 防刷：每个访客 10 分钟最多 5 条、一天最多 20 条；待审核的评论超过 500 条时暂停接收
limits.perIpPer10Minutes=5
limits.perIpPerDay=20
limits.maxPending=500

# 通知（可选）：有新评论、有人在假后台尝试登录时发一条消息。一个接收 JSON 的 webhook 地址，比如企业微信 / 钉钉 / 飞书机器人、Bark、ntfy。
# 消息里不会出现后台的真实地址。
# notify.template 是发过去的内容，{{title}} {{text}} {{url}} 会被替换。不需要就留空。
notify.url=
# 企业微信机器人的写法：
# notify.template={"msgtype":"text","text":{"content":"{{title}}\n{{text}}\n{{url}}"}}
notify.template={"title":"{{title}}","text":"{{text}}","url":"{{url}}"}
