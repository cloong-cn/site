# Nginx 站点配置：放到 /etc/nginx/conf.d/site.conf（或 sites-available 里再软链到 sites-enabled）
# 把 yourname.dev 和证书路径换成你自己的，然后  nginx -t && systemctl reload nginx
# 网站文件在 /srv/blog/live（git push 或后台发布，见 README「自动部署」）；
# 评论服务在本机 8787 端口、后台服务在本机 8788 端口（见 README「评论和后台」）
#
# 后台的地址是一串秘密路径：这个文件里所有的 ADMIN_PATH 都要换成 admin.properties 里 admin.path 去掉开头 / 的那一串，
# 比如 admin.path=/harbor-k3Vq9xTf2LmZ8wRbNp4c 就换成 harbor-k3Vq9xTf2LmZ8wRbNp4c：
#   sudo sed -i 's#ADMIN_PATH#harbor-k3Vq9xTf2LmZ8wRbNp4c#g' /etc/nginx/conf.d/site.conf
# 换好的这份配置文件只放在服务器上，不要提交到 Git 仓库（仓库里的这份一直保持 ADMIN_PATH）。
# HTTPS 证书用 certbot 申请。第一次申请时证书文件还不存在，整份配置会因为找不到证书而启动失败，所以分两步：
#   1. 先只放下面第一个 server（80 端口那段），reload nginx
#   2. certbot certonly --webroot -w /srv/blog/acme -d yourname.dev -d www.yourname.dev
#      （先 sudo mkdir -p /srv/blog/acme；证书验证文件单独放一个目录，不受每次发布切换版本的影响）
#   拿到证书后再换成整份配置，nginx -t && systemctl reload nginx。之后 certbot 会自动续期

# 服务器没有开 IPv6 的话，删掉所有 listen [::] 开头的行，否则 nginx 会启动失败

# 缓存时间按路径和状态码决定：
#   /assets/ 下的文件名带内容哈希，内容变了文件名就变，可以缓存一年；图片原图和视频缓存一天；
#   页面每次都向服务器确认有没有新版本，发布后访客立刻看到；出错的响应（比如 404）一律不缓存
map "$status:$uri" $site_cache {
    "~^\d+:/api/"                               "";     # 评论接口自己决定缓存方式，这里不加
    "~^\d+:/ADMIN_PATH/api/"                    "";     # 后台接口也是
    "~^(200|206|304):/assets/"                 "public, max-age=31536000, immutable";
    "~^(200|206|304):/(images|videos|media)/"  "public, max-age=86400";
    default                                    "no-cache";
}

# 后台不让搜索引擎收录
map $request_uri $site_robots {
    "~^/ADMIN_PATH/"  "noindex, nofollow";
    default           "";
}

# 接口的限流（按访客 IP），超出的请求直接回 429，不会到达后面的服务：
#   评论：平时看文章每页只请求一次，这个额度绰绰有余；后台：登录后才能用，登录本身单独更严
limit_req_zone  $binary_remote_addr zone=comments:10m    rate=60r/m;
limit_req_zone  $binary_remote_addr zone=admin:10m       rate=180r/m;
limit_req_zone  $binary_remote_addr zone=admin_login:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=trap:10m        rate=20r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name yourname.dev www.yourname.dev;
    location /.well-known/acme-challenge/ { root /srv/blog/acme; }
    location / { return 301 https://yourname.dev$request_uri; }
}

server {
    # nginx 1.25.1 及以后会提示这种 http2 写法已过时（只是提示，不影响运行），可以改成 listen 443 ssl; 再单独加一行 http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourname.dev;
    ssl_certificate     /etc/letsencrypt/live/yourname.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourname.dev/privkey.pem;
    return 301 https://yourname.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourname.dev;

    ssl_certificate     /etc/letsencrypt/live/yourname.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourname.dev/privkey.pem;

    root /srv/blog/live;           # 当前版本（发布时整体切换，见 deploy/post-receive）
    index index.html;
    charset utf-8;

    # 构建时已经生成了 .gz / .br，直接发送压缩好的文件
    gzip_static on;
    # brotli_static on;            # 需要 ngx_brotli 模块；装了就打开这行，体积比 gzip 再小 15–20%
    gzip on;                       # 兜底：没有预压缩版本的小文件
    gzip_types text/css application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 600;

    # 每个响应都带上：缓存规则（见文件开头的 map）和几条安全设置
    add_header Cache-Control $site_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # 浏览器以后只用 HTTPS 访问
    add_header X-Frame-Options DENY always;                                            # 不许别的网站用 iframe 嵌入
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;   # 用不到的浏览器权限都关掉
    add_header X-Robots-Tag $site_robots always;                                       # 只对后台生效

    location /.well-known/acme-challenge/ { root /srv/blog/acme; }

    # 评论：转给本机的评论服务。请求体最多 32 KB，整个请求由 Nginx 收完再转过去，
    # 慢吞吞发数据的连接耗的是 Nginx 而不是评论服务
    location ^~ /api/comments {
        limit_req zone=comments burst=30 nodelay;
        limit_conn api_conn 10;
        limit_req_status 429;
        limit_conn_status 429;
        client_max_body_size 32k;
        client_body_timeout 10s;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;      # 评论服务靠它区分访客（只信任本机转来的这个值）
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;

        # 被 Nginx 自己挡下的请求也回 JSON，页面能显示原因
        error_page 429 = @api_429;
        error_page 413 = @api_413;
        error_page 502 503 504 = @comments_down;
    }

    # 后台：只在这个秘密地址。页面就是网站构建出来的 _admin/index.html；接口转给本机的后台服务，
    # 所有接口都要先登录（密码 + 手机验证码），这里再加一层限流
    location = /ADMIN_PATH { return 301 /ADMIN_PATH/; }
    location = /ADMIN_PATH/ {
        try_files /_admin/index.html =404;
    }
    location ^~ /ADMIN_PATH/api/ {
        limit_req zone=admin burst=60 nodelay;
        limit_conn api_conn 10;
        limit_req_status 429;
        limit_conn_status 429;
        client_max_body_size 2m;          # 一篇文章最多约 500 KB
        client_body_timeout 30s;

        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;          # 上传的图片要先处理完才回答
        proxy_max_temp_file_size 0;       # 导出和备份的下载边生成边发送，不先存成临时文件

        location = /ADMIN_PATH/api/login {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://127.0.0.1:8788;
        }
        location = /ADMIN_PATH/api/upload {
            client_max_body_size 26m;     # 图片最多 25 MB
            proxy_pass http://127.0.0.1:8788;
        }
        location = /ADMIN_PATH/api/albums/save {
            client_max_body_size 5m;      # 一个图集的全部备注，服务里限制最多 4 MB
            proxy_pass http://127.0.0.1:8788;
        }
        location = /ADMIN_PATH/api/import {
            client_max_body_size 300m;    # 导入的 zip（文章和图片）最多 300 MB
            client_body_timeout 120s;
            proxy_pass http://127.0.0.1:8788;
        }

        error_page 429 = @api_429;
        error_page 413 = @api_413;
        error_page 502 503 504 = @admin_down;
    }

    # 构建出来的后台页面和假登录页只通过上面和下面的地址给出去，原来的位置不公开
    location ^~ /_admin/ { return 404; }
    location ^~ /_trap/  { return 404; }

    # 假后台：扫描器常试的这些地址都给一个永远登录不了的登录页，由评论服务回答，顺便记下谁来过（不记密码）。
    # 只记录不封禁；后台的「安全」里能看到记录
    location ~* ^/(admin|administrator|wp-admin|wp-login\.php|login|signin|user/login|manager|manage|backend|dashboard|cms|phpmyadmin|pma|admin\.php|adminer\.php)(/.*)?$ {
        limit_req zone=trap burst=10 nodelay;
        limit_conn api_conn 5;
        limit_req_status 429;
        limit_conn_status 429;
        client_max_body_size 16k;
        client_body_timeout 10s;

        rewrite ^ /trap break;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Trap-Path $request_uri;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        error_page 502 503 504 =200 @trap_down;   # 评论服务没在运行时，照样显示那个登录页
    }
    location @trap_down { try_files /_trap/index.html =404; }

    location @api_429       { default_type "application/json; charset=utf-8"; return 429 '{"error":"rate","message":"请求太频繁了，请稍后再试"}'; }
    location @api_413       { default_type "application/json; charset=utf-8"; return 413 '{"error":"too_large","message":"内容太大了"}'; }
    location @comments_down { default_type "application/json; charset=utf-8"; return 503 '{"error":"unavailable","message":"评论服务暂时不可用，请稍后再试"}'; }
    location @admin_down    { default_type "application/json; charset=utf-8"; return 503 '{"error":"unavailable","message":"后台服务没有运行"}'; }

    location ^~ /assets/ {
        # 老版本 nginx 的 mime.types 里可能没有这两种类型
        location ~* \.avif$  { types { } default_type image/avif; }
        location ~* \.woff2$ { types { } default_type font/woff2; }
    }

    # 视频拖进度条靠分段（Range）请求，nginx 默认就支持
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
